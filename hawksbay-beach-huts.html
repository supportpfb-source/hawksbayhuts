<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hawksbay Beach Huts — Karachi</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500;1,6..72,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#EDE0C0; --sand-light:#F7F1DE; --deep-sea:#0E4B5A; --deep-sea-dark:#0A3540;
    --coral:#E76F51; --ink:#1B2B2B; --foam:#FAF6EC; --seagrass:#588157; --gold:#D9A441;
    --busy:#C0392B; --avail:#3E7A45; --wa:#25D366;
    --bs-primary:#0E4B5A; --bs-primary-rgb:14,75,90;
  }
  body{font-family:'Karla',sans-serif; background:var(--foam); color:var(--ink);}
  h1,h2,h3,h4,.serif{font-family:'Newsreader',serif; font-weight:600;}
  .btn-coral{background:var(--coral); border-color:var(--coral); color:#fff;}
  .btn-coral:hover{background:#d65f3f; border-color:#d65f3f; color:#fff;}
  .btn-outline-coral{border-color:var(--coral); color:var(--coral);}
  .btn-outline-coral:hover{background:var(--coral); color:#fff;}
  .text-coral{color:var(--coral);}
  .bg-deepsea{background:var(--deep-sea) !important;}
  .bg-sand{background:var(--sand-light) !important;}
  .navbar-brand em{font-style:italic; color:var(--coral);}
  .navbar{box-shadow:0 1px 6px rgba(0,0,0,0.06);}

  .hero{
    position:relative; color:#fff; min-height:78vh; display:flex; align-items:center;
    background:linear-gradient(180deg, rgba(10,53,64,0.78), rgba(10,53,64,0.88)), url('__HERO_BG__') center/cover no-repeat;
  }
  .hero h1{font-size:3rem; line-height:1.1;}
  .hero h1 i{font-style:italic; color:var(--gold);}
  .hero-stats .num{font-family:'Newsreader',serif; font-size:1.6rem; font-weight:700;}
  .hero-stats .lbl{font-size:0.8rem; opacity:0.75;}

  .ad-slot{border:2px dashed #c9c2a8; background:#fbf8ef; color:#8a8266; text-align:center; padding:22px; border-radius:8px; font-size:0.85rem;}
  .ad-slot .ad-label{font-weight:700; letter-spacing:0.04em; font-size:0.72rem; color:#a99b6c; text-transform:uppercase; margin-bottom:6px; display:block;}

  .hut-card{border:none; border-radius:14px; overflow:hidden; box-shadow:0 6px 20px rgba(14,75,90,0.08); transition:transform .2s ease, box-shadow .2s ease; height:100%;}
  .hut-card:hover{transform:translateY(-5px); box-shadow:0 14px 28px rgba(14,75,90,0.16);}
  .hut-card img{height:190px; object-fit:cover;}
  .stamp{position:absolute; top:12px; right:12px; z-index:3; font-family:'Newsreader',serif; font-weight:700; font-size:0.75rem; padding:5px 12px; border:2px solid; border-radius:4px; transform:rotate(6deg); background:rgba(255,255,255,0.92); text-transform:uppercase;}
  .stamp.available{color:var(--avail); border-color:var(--avail);}
  .stamp.busy{color:var(--busy); border-color:var(--busy);}
  .hut-tag{position:absolute; top:12px; left:12px; z-index:3;}
  .hut-price{font-family:'Newsreader',serif; color:var(--coral); font-weight:700; font-size:1.3rem;}
  .facil-item{background:var(--deep-sea-dark); border-radius:10px; padding:26px 18px; height:100%;}
  .facil-item svg{width:28px; height:28px; stroke:var(--gold); margin-bottom:10px;}
  .price-table th{background:var(--sand-light);}
  .price-table td.hl{color:var(--coral); font-weight:700;}
  .testi-card{border:none; border-radius:14px; background:var(--sand-light); height:100%;}
  .testi-avatar{width:38px; height:38px; border-radius:50%; background:var(--deep-sea); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Newsreader',serif;}
  footer{background:var(--deep-sea-dark); color:rgba(255,255,255,0.85);}
  footer a{color:rgba(255,255,255,0.8);}
  footer a:hover{color:var(--gold);}
  .dev-strip{border-top:1px solid rgba(255,255,255,0.12);}
  .dev-avatar{width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--coral),var(--gold)); display:flex; align-items:center; justify-content:center; font-family:'Newsreader',serif; font-weight:700; color:#fff; flex:none;}

  .wa-float{position:fixed; bottom:22px; inset-inline-end:22px; z-index:1050; width:58px; height:58px; border-radius:50%; background:var(--wa); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(0,0,0,0.25); color:#fff;}
  .wa-float svg{width:30px; height:30px;}

  .filter-btn.active{background:var(--deep-sea); border-color:var(--deep-sea); color:#fff;}
  .add-hut-btn{display:none;}
  body.admin-on .add-hut-btn{display:inline-flex;}
  .admin-row{display:none; gap:6px;}
  body.admin-on .admin-row{display:flex;}
  .comment-item{border-bottom:1px solid #eee; padding:10px 0;}
  .comment-item:last-child{border-bottom:none;}
  .comment-name{font-weight:700; font-size:0.9rem; color:var(--deep-sea-dark);}
  .comment-date{font-size:0.72rem; color:#8a97972; color:#8a9797;}
  .modal-content{border-radius:14px;}
  .lang-btn{border-radius:20px;}
  .admin-btn-nav.is-admin{outline:2px solid var(--coral);}
  @media(max-width:768px){ .hero h1{font-size:2.1rem;} .hero{min-height:60vh;} }
</style>
</head>
<body>

<!-- ===================== NAVBAR ===================== -->
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
  <div class="container">
    <a class="navbar-brand serif fw-bold" href="#top" style="color:var(--deep-sea-dark);">Hawksbay <em>Huts</em></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav mx-auto gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="#huts" data-i18n="nav_huts"></a></li>
        <li class="nav-item"><a class="nav-link" href="#facilities" data-i18n="nav_facilities"></a></li>
        <li class="nav-item"><a class="nav-link" href="#pricing" data-i18n="nav_pricing"></a></li>
        <li class="nav-item"><a class="nav-link" href="#booking" data-i18n="nav_booking"></a></li>
        <li class="nav-item"><a class="nav-link" href="#reviews" data-i18n="nav_reviews"></a></li>
      </ul>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span id="userGreetWrap" class="d-none small fw-semibold text-secondary"></span>
        <button class="btn btn-sm btn-outline-secondary" id="authBtn"></button>
        <button class="btn btn-sm btn-outline-secondary admin-btn-nav" id="adminToggle"></button>
        <button class="btn btn-sm btn-outline-secondary lang-btn" id="langToggle">EN</button>
        <button class="btn btn-sm btn-coral" id="navBookBtn" data-i18n="nav_cta"></button>
      </div>
    </div>
  </div>
</nav>

<!-- ===================== HERO ===================== -->
<header class="hero" id="top">
  <div class="container py-5">
    <div class="row align-items-center">
      <div class="col-lg-8">
        <span class="badge rounded-pill bg-light text-dark mb-3 px-3 py-2" data-i18n="hero_eyebrow"></span>
        <h1 class="fw-semibold mb-3" data-i18n="hero_h1" data-i18n-html="1"></h1>
        <p class="lead mb-4" style="max-width:560px; opacity:0.92;" data-i18n="hero_lead"></p>
        <div class="d-flex gap-2 flex-wrap mb-4">
          <button class="btn btn-coral btn-lg px-4" data-i18n="hero_cta_huts" onclick="document.getElementById('huts').scrollIntoView({behavior:'smooth'})"></button>
          <button class="btn btn-outline-light btn-lg px-4" data-i18n="hero_cta_price" onclick="document.getElementById('pricing').scrollIntoView({behavior:'smooth'})"></button>
        </div>
        <div class="d-flex gap-4 hero-stats flex-wrap">
          <div><div class="num" id="statHuts">14+</div><div class="lbl" data-i18n="stat_huts"></div></div>
          <div><div class="num">Rs 3,500</div><div class="lbl" data-i18n="stat_price"></div></div>
          <div><div class="num">24/7</div><div class="lbl" data-i18n="stat_security"></div></div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Ad slot: leaderboard -->
<div class="container my-4">
  <div class="ad-slot"><span class="ad-label" data-i18n="ad_label"></span>728 x 90 — <span data-i18n="ad_contact"></span></div>
</div>

<!-- ===================== HUTS ===================== -->
<section class="py-5" id="huts">
  <div class="container">
    <div class="mb-4" style="max-width:640px;">
      <span class="text-coral fw-semibold small d-block mb-2" data-i18n="huts_kicker"></span>
      <h2 style="color:var(--deep-sea-dark);" data-i18n="huts_title"></h2>
      <p class="text-secondary" data-i18n="huts_sub"></p>
    </div>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4" id="filterBar">
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-sm btn-outline-secondary rounded-pill filter-btn active" data-filter="all" data-i18n="filter_all"></button>
        <button class="btn btn-sm btn-outline-secondary rounded-pill filter-btn" data-filter="standard" data-i18n="filter_standard"></button>
        <button class="btn btn-sm btn-outline-secondary rounded-pill filter-btn" data-filter="deluxe" data-i18n="filter_deluxe"></button>
        <button class="btn btn-sm btn-outline-secondary rounded-pill filter-btn" data-filter="family" data-i18n="filter_family"></button>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="availOnly">
          <label class="form-check-label small fw-semibold" for="availOnly" data-i18n="filter_avail_only"></label>
        </div>
        <button class="btn btn-sm btn-coral add-hut-btn" id="addHutBtn">+ <span data-i18n="admin_add_hut"></span></button>
      </div>
    </div>
    <div class="row g-4" id="hutGrid"></div>
  </div>
</section>

<!-- Ad slot: in-feed -->
<div class="container my-2 mb-5">
  <div class="ad-slot"><span class="ad-label" data-i18n="ad_label"></span>970 x 250 — <span data-i18n="ad_contact"></span></div>
</div>

<!-- ===================== FACILITIES ===================== -->
<section class="py-5 bg-deepsea text-white" id="facilities">
  <div class="container">
    <div class="mb-4 mx-auto text-center" style="max-width:640px;">
      <span class="fw-semibold small d-block mb-2" style="color:var(--gold)" data-i18n="facil_kicker"></span>
      <h2 data-i18n="facil_title"></h2>
      <p style="opacity:0.75" data-i18n="facil_sub"></p>
    </div>
    <div class="row g-3" id="facilGrid"></div>
  </div>
</section>

<!-- ===================== PRICING ===================== -->
<section class="py-5" id="pricing">
  <div class="container">
    <div class="mb-4" style="max-width:640px;">
      <span class="text-coral fw-semibold small d-block mb-2" data-i18n="price_kicker"></span>
      <h2 style="color:var(--deep-sea-dark);" data-i18n="price_title"></h2>
      <p class="text-secondary" data-i18n="price_sub"></p>
    </div>
    <div class="table-responsive">
      <table class="table table-bordered price-table align-middle bg-white">
        <thead><tr>
          <th data-i18n="price_th_type"></th><th data-i18n="price_th_cap"></th><th data-i18n="price_th_wd"></th><th data-i18n="price_th_we"></th>
        </tr></thead>
        <tbody>
          <tr><td data-i18n="price_r1_type"></td><td data-i18n="price_r1_cap"></td><td>Rs 3,500</td><td class="hl">Rs 5,000</td></tr>
          <tr><td data-i18n="price_r2_type"></td><td data-i18n="price_r2_cap"></td><td>Rs 5,500</td><td class="hl">Rs 7,500</td></tr>
          <tr><td data-i18n="price_r3_type"></td><td data-i18n="price_r3_cap"></td><td>Rs 8,000</td><td class="hl">Rs 11,000</td></tr>
        </tbody>
      </table>
    </div>
    <p class="text-secondary small" data-i18n="price_note"></p>
  </div>
</section>

<!-- ===================== BOOKING ===================== -->
<section class="py-5 bg-sand" id="booking">
  <div class="container">
    <div class="row g-5">
      <div class="col-lg-7">
        <span class="text-coral fw-semibold small d-block mb-2" data-i18n="booking_kicker"></span>

          </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold" data-i18n="form_phone"></label>
              <input type="tel" class="form-control" id="bPhone" placeholder="03xx-xxxxxxx" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold" data-i18n="form_date"></label>
              <input type="date" class="form-control" id="bDate" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" data-i18n="form_type"></label>
            <select class="form-select" id="bType"></select>
          </div>
          <button type="submit" class="btn btn-coral w-100 py-2 fw-semibold" data-i18n="form_submit"></button>
          <div class="alert alert-success mt-3 d-none" id="formMsg" data-i18n="form_success"></div>
        </form>
      </div>

          0304-1291775
        </div>
        <div class="d-flex align-items-center gap-2 mb-3 fw-semibold" style="color:var(--deep-sea-dark);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          info@hawksbayhuts.pk
        </div>
        <button class="btn btn-lg w-100 mb-4 text-white fw-semibold" style="background:var(--wa);" id="waDirectBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-4px; margin-inline-end:6px;"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.79.47 3.47 1.29 4.93L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.13c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.96-.3-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36.19 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2.01.89 2.16.07.15.12.32.02.51-.09.19-.14.31-.28.48-.14.16-.29.36-.42.49-.14.14-.28.29-.12.57.16.28.7 1.16 1.51 1.87 1.04.93 1.92 1.22 2.19 1.36.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.27.13.44.19.51.3.07.11.07.62-.17 1.3z"/></svg>

        <div class="ad-slot"><span class="ad-label" data-i18n="ad_label"></span>300 x 400 — <span data-i18n="ad_contact"></span></div>
      </div>
    </div>
  </div>
</section>

<!-- ===================== TESTIMONIALS ===================== -->
<section class="py-5" id="reviews">
  <div class="container">
    <div class="mb-4" style="max-width:640px;">

    <div class="row g-4" id="testiGrid"></div>

</section>

<!-- ===================== HUT DETAIL MODAL ===================== -->
<div class="modal fade" id="hutDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="mdTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">

function renderComments(hutId){
  const list = comments[hutId] || [];

  wrap.innerHTML = list.length ? list.map(c=>`
    <div class="comment-item">
      <div class="d-flex justify-content-between">
        <span class="comment-name">${c.name}</span>
        <span class="comment-date">${c.date}</span>
      </div>
      <p class="mb-0 small">${c.text}</p>
      ${isAdmin ? '<button class="btn btn-sm btn-link text-danger p-0 admin-del-comment" data-idx="'+list.indexOf(c)+'">'+t('admin_delete')+'</button>' : ''}
    </div>`).join('') : `<p class="text-secondary small">${t('no_comments')}</p>`;
  wrap.querySelectorAll('.admin-del-comment').forEach(b=>b.addEventListener('click', ()=>{
    list.splice(parseInt(b.dataset.idx),1);
    comments[hutId] = list; saveComments(comments); renderComments(hutId);
  }));
  const formWrap = document.getElementById('mdCommentFormWrap');
  const loginPrompt = document.getElementById('mdCommentLoginPrompt');
  if(currentUser){ formWrap.classList.remove('d-none'); loginPrompt.classList.add('d-none'); }
  else { formWrap.classList.add('d-none'); loginPrompt.classList.remove('d-none'); }
}

  if(!text || !currentUser || currentHutId===null) return;

  comments[currentHutId].push({name:currentUser.name, text:text, date:new Date().toLocaleDateString()});

  if(currentUser){
    btn.textContent = t('admin_logout');
    greet.textContent = t('auth_welcome').replace('{name}', currentUser.name);

  } else {

  }

});

document.getElementById('regSubmitBtn').addEventListener('click', ()=>{
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pass = document.getElementById('regPassword').value;
  const err = document.getElementById('regErr');
  if(!name || !email || !pass){ err.textContent = t('auth_err_fill'); return; }
  const users = loadUsers();
  if(users.find(u=>u.email===email)){ err.textContent = t('auth_err_exists'); return; }
  users.push({name:name, email:email, pass:pass});
  saveUsers(users);
  currentUser = {name:name, email:email};
  sessionStorage.setItem('hb_current_user', JSON.stringify(currentUser));
  err.textContent = ''; registerModal.hide(); updateAuthUI();
  if(currentHutId!==null) renderComments(currentHutId);
});
document.getElementById('loginSubmitBtn').addEventListener('click', ()=>{
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginErr');
  const users = loadUsers();
  const found = users.find(u=>u.email===email && u.pass===pass);
  if(!found){ err.textContent = t('auth_err_invalid'); return; }
  currentUser = {name:found.name, email:found.email};
  sessionStorage.setItem('hb_current_user', JSON.stringify(currentUser));
  err.textContent = ''; loginModal.hide(); updateAuthUI();
  if(currentHutId!==null) renderComments(currentHutId);
});

    updateAdminUI(); adminLoginModal.hide(); renderHuts();
    if(currentHutId!==null) renderComments(currentHutId);
  } else { err.textContent = currentLang==='ur' ? 'غلط یوزر نیم یا پاس ورڈ' : 'Incorrect username or password'; }
});

/* =============== ADD/EDIT HUT =============== */
const hutFormModal = new bootstrap.Modal(document.getElementById('hutFormModal'));
const hutForm = document.getElementById('hutForm');
let editingId = null;
document.getElementById('addHutBtn').addEventListener('click', ()=>openHutForm(null));
function openHutForm(id){
  editingId = id;
  document.getElementById('hutFormErr').textContent = '';
  document.getElementById('hutFormTitle').textContent = t(id ? 'admin_edit' : 'admin_add_hut');
  if(id){
    const h = huts.find(x=>x.id===id);
    document.getElementById('fNameEn').value = h.name.en;
    document.getElementById('fNameUr').value = h.name.ur;
    document.getElementById('fCat').value = h.cat;
    document.getElementById('fPrice').value = h.price;
    document.getElementById('fCapEn').value = h.cap.en;
    document.getElementById('fCapUr').value = h.cap.ur;
    document.getElementById('fDescEn').value = h.desc.en;
    document.getElementById('fDescUr').value = h.desc.ur;
    document.getElementById('fFacilsEn').value = h.facils.en.join(', ');
    document.getElementById('fFacilsUr').value = h.facils.ur.join(', ');
    document.getElementById('fStatus').value = h.status;
    document.getElementById('fImageSet').value = h.imgSet || 0;
  } else { hutForm.reset(); }
  hutFormModal.show();
}
hutForm.addEventListener('submit', function(e){
  e.preventDefault();
  const nameEn = document.getElementById('fNameEn').value.trim();
  const nameUr = document.getElementById('fNameUr').value.trim();
  const price = document.getElementById('fPrice').value.trim();
  if(!nameEn || !nameUr || !price){ document.getElementById('hutFormErr').textContent = currentLang==='ur' ? 'براہ کرم تمام لازمی خانے پُر کریں' : 'Please fill all required fields'; return; }
  const data = {
    cat: document.getElementById('fCat').value, price: price, status: document.getElementById('fStatus').value,
    imgSet: parseInt(document.getElementById('fImageSet').value),
    name:{en:nameEn, ur:nameUr},
    cap:{en:document.getElementById('fCapEn').value.trim(), ur:document.getElementById('fCapUr').value.trim()},
    desc:{en:document.getElementById('fDescEn').value.trim(), ur:document.getElementById('fDescUr').value.trim()},
    facils:{en:document.getElementById('fFacilsEn').value.split(',').map(s=>s.trim()).filter(Boolean), ur:document.getElementById('fFacilsUr').value.split(',').map(s=>s.trim()).filter(Boolean)}
  };
  if(editingId){ const idx = huts.findIndex(x=>x.id===editingId); huts[idx] = Object.assign({id:editingId}, data); }
  else { const newId = huts.length ? Math.max(...huts.map(h=>h.id))+1 : 1; huts.push(Object.assign({id:newId}, data)); }
  saveHuts(huts); hutFormModal.hide(); renderHuts();
});

/* =============== LANGUAGE TOGGLE =============== */
document.getElementById('langToggle').addEventListener('click', ()=>applyLang(currentLang==='ur'?'en':'ur'));

/* =============== BOOKING FORM -> WHATSAPP =============== */
document.getElementById('bookingForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('bName').value;
  const phone = document.getElementById('bPhone').value;
  const date = document.getElementById('bDate').value;
  const type = document.getElementById('bType').value;
  const msg = (currentLang==='ur'
    ? `السلام علیکم، میں ایک حٹ بک کروانا چاہتا/چاہتی ہوں۔\nنام: ${name}\nفون: ${phone}\nتاریخ: ${date}\nحٹ کی قسم: ${type}`
    : `Hello, I would like to book a hut.\nName: ${name}\nPhone: ${phone}\nDate: ${date}\nHut Type: ${type}`);
  window.open(waLink(msg), '_blank');
  document.getElementById('formMsg').classList.remove('d-none');
  this.reset();
  setTimeout(()=>document.getElementById('formMsg').classList.add('d-none'), 5000);
});
document.getElementById('waDirectBtn').addEventListener('click', ()=>{
  window.open(waLink(currentLang==='ur' ? 'السلام علیکم، مجھے حٹ کی بکنگ کے بارے میں معلومات چاہییں۔' : 'Hello, I would like information about hut bookings.'), '_blank');
});
document.getElementById('navBookBtn').addEventListener('click', ()=>document.getElementById('booking').scrollIntoView({behavior:'smooth'}));
document.getElementById('waFloat').addEventListener('click', function(e){
  e.preventDefault();
  window.open(waLink(currentLang==='ur' ? 'السلام علیکم، مجھے حٹ بکنگ میں دلچسپی ہے۔' : 'Hello, I am interested in booking a hut.'), '_blank');
});

/* =============== INIT =============== */
updateAdminUI();
applyLang(currentLang);
</script>
